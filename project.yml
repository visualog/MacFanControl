name: MFC
options:
  minimumXcodeGenVersion: 2.39.0
packages:
  SharedModels:
    path: packages/SharedModels
  ControlCore:
    path: packages/ControlCore
  RemoteProtocol:
    path: packages/RemoteProtocol
  SMCBridge:
    path: packages/SMCBridge
settings:
  base:
    SWIFT_VERSION: 6.0
schemes:
  MacFanControl:
    build:
      targets:
        MacFanControl: all
    run:
      config: Debug
  iPhoneRemote:
    build:
      targets:
        iPhoneRemote: all
    run:
      config: Debug
  MacFanControlHelper:
    build:
      targets:
        MacFanControlHelper: all
    run:
      config: Debug
targets:
  MacFanControl:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: apps/MacFanControl/Sources
      - path: apps/Support/HelperIPC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.visualog.mfc.mac
        PRODUCT_NAME: MacFanControl
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
    dependencies:
      - package: SharedModels
      - package: ControlCore
      - package: RemoteProtocol
      - package: SMCBridge
  MacFanControlHelper:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: apps/MacFanControlHelper/Sources
      - path: apps/Support/HelperIPC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.visualog.mfc.helper
        PRODUCT_NAME: MacFanControlHelper
    dependencies:
      - package: SharedModels
      - package: SMCBridge
  iPhoneRemote:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: apps/iPhoneRemote/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.visualog.mfc.ios
        PRODUCT_NAME: iPhoneRemote
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
      configs:
        Debug:
          CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: NO
          CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]: NO
          CODE_SIGN_IDENTITY[sdk=iphonesimulator*]: ""
    dependencies:
      - package: SharedModels
      - package: RemoteProtocol
